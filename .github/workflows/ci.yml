name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vetores-e-sintaxe:
    name: Sintaxe, higiene e vetores (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilação e verificação de sintaxe
        run: python -m py_compile implementacao/*.py testes/*.py ferramentas/*.py ferramentas/medicao_v52/*.py

      - name: Higiene (segredos e arquivos sensíveis)
        run: python ferramentas/verificar_higiene.py

      - name: Vetores KAT da v4 e da v5.2
        run: |
          python ferramentas/rsd_cli.py --json kat
          python ferramentas/rsd_cli.py --json kat52

  testes-unitarios:
    name: Testes determinísticos (${{ matrix.numpy-spec }})
    runs-on: ubuntu-latest
    needs: vetores-e-sintaxe
    strategy:
      fail-fast: false
      matrix:
        numpy-spec: ["numpy>=1.26,<2.0", "numpy>=2.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: NumPy
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.numpy-spec }}"

      - name: Suíte determinística
        run: |
          python -m unittest \
            testes/test_rsd_s_v4.py \
            testes/test_cli_and_repo.py \
            testes/test_higiene.py \
            testes/test_matriz_b.py \
            testes/test_rsd_s_v5_and_bandlimited.py \
            testes/test_lote_b_cryptanalysis.py \
            testes/test_milestone1_cryptographic_evaluation.py \
            testes/test_milestone3_threat_model_bounds.py \
            testes/test_v52_high_fixes.py \
            testes/test_v52_medium_fixes.py \
            testes/test_vetores_v52.py -v

      - name: Suíte estatística de avalanche e MDS
        run: python testes/suite_testes_completa.py
