name: Pages

# Publica o site estático (site/dist) no GitHub Pages. Pré-requisito, feito uma vez pelo dono do repositório:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# O build roda os testes rápidos do motor antes de publicar; se a paridade com o Python falhar, nada é publicado.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "implementacao/**"
      - "especificacao/ESPECIFICACAO_V5_2.md"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir e testar o site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Testes do motor (paridade com o Python), glifos e feixe
        working-directory: site
        run: node --test "testes/*.test.js"

      - name: Construir
        run: node site/ferramentas/build.mjs

      - name: Configurar o Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
